name: Test, sync chronology XML and deploy Pages
on:
  push:
    branches: [main]
    paths-ignore:
      - 'finance/**'
      - '.github/workflows/finance.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
permissions:
  actions: read
  contents: write
  pages: write
  id-token: write
concurrency:
  group: site-pages-deploy
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    # Preserve the original environment for any environment-scoped builder secrets.
    environment:
      name: github-pages
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - name: Checkout chronology website
        uses: actions/checkout@v5
      - name: Checkout public XML text database
        uses: actions/checkout@v5
        with:
          repository: Ishayahu/jewTeX_TEXTS_DB
          ref: master
          path: .source-chronology
          persist-credentials: false
      - name: Unit tests for XML synchronization
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Generate chronology JSON from XML
        run: |
          python3 scripts/sync_chronology.py --source-dir .source-chronology/lastov_ishayahu/chronos --output-dir data
          python3 scripts/sync_chronology.py --source-dir .source-chronology/lastov_ishayahu/chronos --output-dir data --check
      - name: Check chronology logic and semantic graph
        run: node --test tests/*.test.mjs
      - name: Check JavaScript syntax
        run: node --check src/app.mjs && node --check src/model.mjs && node --check christianity/app.mjs && node --check christianity/model.mjs && node --check finance/app.js
      - name: Check hidden XML metadata XSLT templates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          ns={'xsl':'http://www.w3.org/1999/XSL/Transform'}
          for name in ('html.xslt','quote_html.xslt','markdown.xslt'):
              path=Path('.source-chronology/.meta')/name
              tree=ET.parse(path)
              skips=[x for x in tree.findall('.//xsl:template',ns) if x.get('match')=='chronology_data' and not list(x) and not (x.text or '').strip()]
              assert skips, f'{name}: hidden chronology metadata is not excluded from XSLT output'
              print(f'{name}: chronology_data excluded')
          PY
      - name: Commit generated JSON if changed
        run: |
          if ! git diff --quiet -- data/events.json data/claims.json data/constraints.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/events.json data/claims.json data/constraints.json
            git commit -m 'chore: sync chronology JSON from canonical XML [skip ci]'
            git push
          else
            echo 'Chronology JSON already up to date'
          fi
      - name: Test Calc publisher, fixed daily goals and encryption
        run: |
          python3 -m pip install --quiet --user cryptography
          python3 -m unittest finance.tests.test_calc_publisher -v
      # LOCAL_CALC_SNAPSHOT_READY: both GitHub Pages workflows must keep
      # committed owner.enc and family.enc intact once local upload begins.
      - name: Use committed encrypted Calc snapshot, or legacy builder until first upload
        env:
          FINANCE_OWNER_PASSWORD: ${{ secrets.FINANCE_OWNER_PASSWORD }}
          WIFE_PASSWORD: ${{ secrets.WIFE_PASSWORD }}
          FINANCE_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.FINANCE_GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if test -s finance/data/owner.enc && test -s finance/data/family.enc; then
            echo 'Using encrypted local-Calc snapshots already committed in finance/data/'
          else
            echo 'Local Calc snapshot not committed yet; preserving existing Google Sheets deployment.'
            test -n "$FINANCE_OWNER_PASSWORD" || { echo 'Missing FINANCE_OWNER_PASSWORD'; exit 1; }
            test -n "$WIFE_PASSWORD" || { echo 'Missing WIFE_PASSWORD'; exit 1; }
            test -n "$FINANCE_GOOGLE_SERVICE_ACCOUNT_JSON" || { echo 'Missing finance Google credential'; exit 1; }
            python3 -m pip install --quiet --user google-auth requests cryptography
            python3 finance/build_encrypted.py
          fi
      - name: Stage GitHub Pages artifact
        run: |
          mkdir -p dist
          cp index.html .nojekyll dist/
          cp -R src data christianity dist/
          cp -R finance dist/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload static site
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  # Separate jobs avoid the artifact service visibility race (actions/deploy-pages#451).
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for Pages artifact to become visible
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        run: |
          if ! [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]; then
            echo '::error::Upload did not return a valid Pages artifact ID'
            exit 1
          fi
          # Check REST visibility; deploy-pages uses a separate internal artifact service.
          timeout 120s bash <<'BASH' || { echo '::error::Pages artifact did not become visible within 120 seconds'; exit 1; }
          set -euo pipefail
          while true; do
            if gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages&per_page=100" \
              --jq '.artifacts[] | select(.expired == false) | .id' | grep -Fx "$ARTIFACT_ID"; then
              echo "Pages artifact $ARTIFACT_ID is visible in the run artifact list."
              exit 0
            fi
            echo 'Pages artifact not visible yet; retrying in 5 seconds.'
            sleep 5
          done
          BASH
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
